<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RYN THE JOURNAL</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d10;--c:#14181d;--b:#232a32;--t:#d8dee6;--m:#7b8794;--g:#2ecc8f;--r:#ef5b5b;--a:#e0b84c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font:13px 'JetBrains Mono',ui-monospace,Menlo,monospace;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{padding:12px 12px 90px;max-width:640px;margin:auto}
h3{font-size:11px;letter-spacing:.12em;color:var(--m);margin:18px 0 8px;font-weight:700}
.card{background:var(--c);border:1px solid var(--b);border-radius:6px;padding:10px;margin-bottom:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid .card{margin:0}
.k{font-size:10px;color:var(--m);letter-spacing:.08em}.v{font-size:17px;font-weight:700;margin-top:3px}
.g{color:var(--g)}.r{color:var(--r)}.a{color:var(--a)}.m{color:var(--m)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0e1114;border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:var(--m);font:inherit;font-size:11px;padding:14px 0;letter-spacing:.08em}nav button.on{color:var(--g);box-shadow:inset 0 2px var(--g)}
button,input,select,textarea{font:inherit;color:var(--t)}
.btn{background:var(--g);color:#04120c;border:0;border-radius:5px;padding:10px 14px;font-weight:700}.btn.s{background:var(--c);color:var(--t);border:1px solid var(--b)}.btn.d{background:var(--r);color:#fff}
input,select,textarea{background:#0e1114;border:1px solid var(--b);border-radius:5px;padding:9px;width:100%}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{background:#0e1114;border:1px solid var(--b);border-radius:4px;padding:6px 8px;font-size:11px;color:var(--m)}.chip.on{border-color:var(--g);color:var(--g)}
table{width:100%;border-collapse:collapse;font-size:11px}td,th{padding:6px 3px;border-bottom:1px solid var(--b);text-align:right}td:first-child,th:first-child{text-align:left}th{color:var(--m);font-weight:400}
.modal{position:fixed;inset:0;background:var(--bg);overflow:auto;padding:14px;padding-top:calc(14px + env(safe-area-inset-top,0px));z-index:5}
.modal>div{max-width:640px;margin:auto}label{display:block;font-size:10px;color:var(--m);letter-spacing:.08em;margin:12px 0 5px}
.thumbs{display:flex;gap:6px;overflow-x:auto}.thumbs img{height:80px;border-radius:4px;border:1px solid var(--b)}
#sp{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9;letter-spacing:.3em;font-weight:700;animation:sp 2.2s ease-in-out forwards}
@keyframes sp{0%{opacity:0}30%{opacity:1}70%{opacity:1}100%{opacity:0;visibility:hidden}}
.ins{border-left:2px solid var(--a);padding-left:8px;margin:6px 0;line-height:1.5}
</style></head><body>
<div id="sp">RYN THE JOURNAL</div><div id="app"></div>
<nav id="nav"></nav><div id="md"></div>
<script>
const $=s=>document.querySelector(s);
const O={day:['MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY'],pair:['XAUUSD','NAS100','US30','EURUSD','GBPUSD'],session:['ASIA SESSION','LONDON SESSION','NEW YORK AM','NEW YORK PM'],model:['FVG','IFVG','LIQUIDITY SWEEP','MSS','ORDER BLOCK','REJECTION BLOCK','SELL SIDE LIQUIDITY','BUY SIDE LIQUIDITY','LIQUIDITY VOID','ASIA HIGH','ASIA LOW','LONDON HIGH','LONDON LOW','SMT','SSMT','CISD','SUPPORT','RESISTANCE','SBR','RBS','BREAKER BLOCK','BREAK','SWEEP','OHLC','OLHC','CRT'],tf:['H4','H1','M15','M5','M3','M1'],dir:['BUY','SELL'],result:['TP','SL','BE']};
const RRS=['1:1','1:1.5','1:2','1:3'],RKS=['0.25%','0.5%','1%','2%'];
let T=[],F={},tab='dash',S={min:5,risk:'0.5%',rr:'1:2',cur:'USD'},D=null;
const db=()=>new Promise(r=>{const q=indexedDB.open('ryn',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result)});
const kget=async k=>{const d=await db();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result)})};
const kset=async(k,v)=>{const d=await db();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=r})};
const save=()=>kset('trades',T),saveS=()=>kset('set',S);
const rr=t=>parseFloat(String(t.rr||'').split(':')[1])||0;
const tr=t=>t.result=='TP'?rr(t):t.result=='SL'?-1:0;
const fr=x=>(x>=0?'+':'')+(+x.toFixed(2))+'R',pf=x=>x==null?'N/A':x.toFixed(2),cl=x=>x>0?'g':x<0?'r':'';
const sum=a=>a.reduce((x,y)=>x+y,0);
const ord=a=>[...a].sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time)||x.no-y.no);
function st(a){const n=a.length,rs=ord(a).map(tr),w=rs.filter(x=>x>0),l=rs.filter(x=>x<0),gw=sum(w),gl=-sum(l);
 let mw=0,ml=0,cw=0,cL=0;rs.forEach(x=>{cw=x>0?cw+1:0;cL=x<0?cL+1:0;mw=Math.max(mw,cw);ml=Math.max(ml,cL)});
 const wr=n?w.length/n:0,aw=w.length?gw/w.length:0,al=l.length?gl/l.length:0;
 return{n,w:w.length,l:l.length,be:n-w.length-l.length,wr,lr:n?l.length/n:0,tot:sum(rs),avg:n?sum(rs)/n:0,exp:n?wr*aw-(l.length/n)*al:0,pf:gl?gw/gl:null,mw,ml,best:n?Math.max(...rs):0,worst:n?Math.min(...rs):0}}
const grp=(a,fn)=>{const m={};a.forEach(t=>[].concat(fn(t)).forEach(k=>k&&(m[k]=m[k]||[]).push(t)));return m};
const fl=()=>T.filter(t=>{for(const k of['pair','session','model','tf','day'])if(F[k]&&!(t[k]||[]).includes(F[k]))return 0;
 if(F.dir&&t.dir!=F.dir||F.result&&t.result!=F.result||F.from&&t.date<F.from||F.to&&t.date>F.to)return 0;
 if(F.q){const s=JSON.stringify([t.pair,t.session,t.model,t.note,t.tf,t.date]).toLowerCase();if(!s.includes(F.q.toLowerCase()))return 0}return 1});
const card=(k,v,c='')=>`<div class=card><div class=k>${k}</div><div class="v ${c}">${v}</div></div>`;
function filt(){const sel=(k,o)=>`<select onchange="F['${k}']=this.value;go()"><option value="">${k.toUpperCase()}</option>${o.map(x=>`<option ${F[k]==x?'selected':''}>${x}</option>`).join('')}</select>`;
 return`<details class=card ${Object.keys(F).length?'open':''}><summary class=k>FILTER ${Object.keys(F).filter(k=>F[k]).length||''}</summary><div class=grid style="margin-top:8px">${['pair','session','dir','result','model','tf','day'].map(k=>sel(k,O[k])).join('')}<input type=date value="${F.from||''}" onchange="F.from=this.value;go()"><input type=date value="${F.to||''}" onchange="F.to=this.value;go()"></div><button class="btn s" style="margin-top:8px" onclick="F={};go()">RESET</button></details>`}
const NO='<div class="card m" style="text-align:center;padding:30px">NO TRADING DATA YET</div>';
function line(vals){if(vals.length<2)return'';const mn=Math.min(...vals),mx=Math.max(...vals),h=mx-mn||1,p=vals.map((v,i)=>`${(i/(vals.length-1)*290+5).toFixed(1)},${(110-(v-mn)/h*100).toFixed(1)}`).join(' ');
 return`<svg viewBox="0 0 300 120" width=100%><polyline points="${p}" fill=none stroke="#2ecc8f" stroke-width=2 /><text x=4 y=10 fill="#7b8794" font-size=8>${fr(mx)}</text><text x=4 y=118 fill="#7b8794" font-size=8>${fr(mn)}</text></svg>`}
function bars(m){const e=Object.entries(m).sort();if(!e.length)return'';const vs=e.map(x=>sum(x[1].map(tr))),mx=Math.max(...vs.map(Math.abs),1),w=290/e.length;
 return`<svg viewBox="0 0 300 130" width=100%>${e.map((x,i)=>{const h=Math.abs(vs[i])/mx*45;return`<rect x=${5+i*w+2} y=${vs[i]>=0?55-h:55} width=${Math.max(w-4,3)} height=${h} fill="${vs[i]>=0?'#2ecc8f':'#ef5b5b'}"/><text x=${5+i*w+w/2} y=${vs[i]>=0?52-h:68+h} font-size=7 fill="#7b8794" text-anchor=middle>${+vs[i].toFixed(1)}</text><text x=${5+i*w+w/2} y=125 font-size=6 fill="#7b8794" text-anchor=middle>${x[0].slice(2)}</text>`}).join('')}</svg>`}
function tb(m,sortBy='tot'){const e=Object.entries(m).map(([k,a])=>[k,st(a)]).sort((x,y)=>y[1][sortBy]-x[1][sortBy]);
 return`<div class=card style="overflow-x:auto"><table><tr><th></th><th>N</th><th>WR</th><th>TOT</th><th>EXP</th><th>PF</th></tr>${e.map(([k,s])=>`<tr><td>${k}</td><td>${s.n}</td><td>${(s.wr*100).toFixed(0)}%</td><td class=${cl(s.tot)}>${fr(s.tot)}</td><td>${fr(s.exp)}</td><td>${pf(s.pf)}</td></tr>`).join('')}</table></div>`}
function dash(a){if(!a.length)return NO;const s=st(a),rrs=a.map(rr).filter(x=>x),id=a.map(t=>+t.ideal).filter(x=>x>0),
 chp=a.filter(t=>t.result=='SL'&&+t.ideal>=1).length,chb=a.filter(t=>t.result=='SL'&&+t.ideal>=.5&&+t.ideal<1).length;let c=0;const eq=[0,...ord(a).map(t=>c+=tr(t))];
 return`<div class=grid>${card('TOTAL TRADES',s.n)}${card('WIN RATE',(s.wr*100).toFixed(1)+'%','g')}${card('WIN / LOSS / BE',`${s.w} / ${s.l} / ${s.be}`)}${card('LOSS RATE',(s.lr*100).toFixed(1)+'%','r')}${card('TOTAL R',fr(s.tot),cl(s.tot))}${card('AVERAGE R',fr(s.avg),cl(s.avg))}${card('EXPECTANCY',fr(s.exp)+' / trade',cl(s.exp))}${card('PROFIT FACTOR',pf(s.pf))}${card('AVG RR',rrs.length?(sum(rrs)/rrs.length).toFixed(2):'N/A')}${card('MAX RR',rrs.length?Math.max(...rrs):'N/A')}${card('IDEAL AVG RR',id.length?(sum(id)/id.length).toFixed(2):'N/A')}${card('MAX IDEAL RR',id.length?Math.max(...id):'N/A')}${card('COULD HAVE PROFIT',chp)}${card('COULD HAVE BE',chb)}${card('MAX CONSEC WIN',s.mw,'g')}${card('MAX CONSEC LOSS',s.ml,'r')}${card('BEST TRADE',fr(s.best),'g')}${card('WORST TRADE',fr(s.worst),'r')}</div><h3>EQUITY CURVE (CUMULATIVE R)</h3><div class=card>${line(eq)}</div>`}
function combos(a){const m={};a.forEach(t=>{const g=[...(t.pair||[]),...(t.session||[]),t.dir,...(t.model||[])].filter(Boolean).sort(),o=[];
 for(let i=0;i<g.length;i++)for(let j=i+1;j<g.length;j++){o.push([g[i],g[j]]);for(let k=j+1;k<g.length;k++)o.push([g[i],g[j],g[k]])}
 o.forEach(x=>(m[x.join(' + ')]=m[x.join(' + ')]||[]).push(t))});
 const e=Object.entries(m).filter(([k,v])=>v.length>=S.min).map(([k,v])=>[k,v]);return e}
function pattern(a){const dims={SESSION:t=>t.session,PAIR:t=>t.pair,DIRECTION:t=>t.dir,DAY:t=>t.day,MODEL:t=>t.model,'TIME FRAME':t=>t.tf,MONTH:t=>(t.date||'').slice(0,7),'JAM ENTRY':t=>((t.time||'').match(/\d{1,2}/)||[''])[0]},out=[];
 for(const[n,f]of Object.entries(dims)){const e=Object.entries(grp(a,f)).filter(([k,v])=>v.length>=S.min).map(([k,v])=>[k,st(v)]);if(e.length<2)continue;
  const b=[...e].sort((x,y)=>y[1].wr-x[1].wr),w=b[b.length-1];
  out.push(`Data menunjukkan ${n} <b>${b[0][0]}</b> memiliki win rate tertinggi (${(b[0][1].wr*100).toFixed(0)}% dari ${b[0][1].n} trade), sedangkan <b>${w[0]}</b> terendah (${(w[1].wr*100).toFixed(0)}% dari ${w[1].n} trade).`)}
 return out.length?out.map(x=>`<div class=ins>${x}</div>`).join(''):`<div class=m>Belum cukup data (min ${S.min} trade per grup).</div>`}
function ana(a){if(!a.length)return NO;const cb=combos(a).map(([k,v])=>[k,st(v)]).sort((x,y)=>y[1].exp-x[1].exp),cm=Object.fromEntries;
 const mod=Object.entries(grp(a,t=>t.model)).map(([k,v])=>[k,st(v)]).sort((x,y)=>y[1].tot-x[1].tot);
 const cbt=x=>x.length?`<div class=card style="overflow-x:auto"><table><tr><th></th><th>N</th><th>WR</th><th>TOT</th><th>EXP</th><th>PF</th></tr>${x.map(([k,s])=>`<tr><td style="max-width:120px;word-break:break-word">${k}</td><td>${s.n}</td><td>${(s.wr*100).toFixed(0)}%</td><td class=${cl(s.tot)}>${fr(s.tot)}</td><td>${fr(s.exp)}</td><td>${pf(s.pf)}</td></tr>`).join('')}</table></div>`:`<div class="card m">Belum ada kombinasi dengan min ${S.min} trade.</div>`;
 return`<h3>PERFORMANCE BY SESSION</h3>${tb(grp(a,t=>t.session))}<h3>BY MONTH</h3><div class=card>${bars(grp(a,t=>t.date.slice(0,7)))}</div><h3>BY YEAR</h3>${tb(grp(a,t=>t.date.slice(0,4)))}<h3>BY MODEL</h3>${tb(grp(a,t=>t.model))}${mod.length?`<div class=ins>BEST MODEL: <b>${mod[0][0]}</b> ${fr(mod[0][1].tot)}<br>WORST MODEL: <b>${mod[mod.length-1][0]}</b> ${fr(mod[mod.length-1][1].tot)}</div>`:''}
 <h3>COMBINATION ANALYSIS · MIN SAMPLE <select style="width:auto;padding:3px" onchange="S.min=+this.value;saveS();go()">${[3,5,10,20,30].map(x=>`<option ${S.min==x?'selected':''}>${x}</option>`).join('')}</select></h3><h3>TOP COMBINATIONS</h3>${cbt(cb.slice(0,6))}<h3>WORST COMBINATIONS</h3>${cbt(cb.slice(-6).reverse())}<h3>PATTERN</h3>${pattern(a)}`}
function jour(a){const l=ord(a).reverse();return`<input placeholder="SEARCH..." value="${F.q||''}" onchange="F.q=this.value;go()" style="margin-bottom:8px">`+(l.length?l.map(t=>`<div class=card onclick="view(${t.no})"><div class=k>#${String(t.no).padStart(3,'0')} · ${t.date} · ${(t.pair||[]).join(',')} · ${t.dir}</div><div class=m style="margin:6px 0">${(t.session||[]).join(' • ')}</div><div>${(t.model||[]).join(' • ')}</div><div class=m>${(t.tf||[]).join(' • ')}</div><div style="display:flex;justify-content:space-between;margin-top:6px"><span class=m>RR ${t.rr||'-'} · RISK ${t.risk||'-'}</span><b class=${cl(tr(t))}>${fr(tr(t))}</b></div></div>`).join(''):NO)}
function setg(){return`<h3>SETTINGS</h3><div class=card><label>CURRENCY</label><input value="${S.cur}" onchange="S.cur=this.value;saveS()"><label>DEFAULT RISK</label><input value="${S.risk}" onchange="S.risk=this.value;saveS()"><label>DEFAULT RR</label><input value="${S.rr}" onchange="S.rr=this.value;saveS()"><label>MINIMUM SAMPLE</label><select onchange="S.min=+this.value;saveS()">${[3,5,10,20,30].map(x=>`<option ${S.min==x?'selected':''}>${x}</option>`).join('')}</select><label>DARK MODE</label><div class=m>Aktif (default)</div></div><h3>DATA</h3><div class=grid><button class="btn s" onclick="ex('csv')">EXPORT CSV</button><button class="btn s" onclick="im('csv')">IMPORT CSV</button><button class="btn s" onclick="ex('json')">BACKUP</button><button class="btn s" onclick="im('json')">RESTORE</button></div>`}
const CK=['no','date','day','pair','session','dir','model','tf','rr','risk','result','time','ideal','note'];
const csv=()=>CK.join(',')+'\n'+T.map(t=>CK.map(k=>'"'+String(Array.isArray(t[k])?t[k].join('|'):t[k]??'').replace(/"/g,'""')+'"').join(',')).join('\n');
function parseCsv(s){const rows=[];let r=[],c='',q=0;for(let i=0;i<s.length;i++){const ch=s[i];if(q){if(ch=='"'&&s[i+1]=='"'){c+='"';i++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&s[i+1]=='\n')i++;r.push(c);rows.push(r);r=[];c=''}else c+=ch}if(c||r.length){r.push(c);rows.push(r)}return rows}
function ex(k){md(`<h3>${k=='csv'?'EXPORT CSV':'BACKUP JSON'} — salin & simpan</h3><textarea id=tx rows=14 readonly>${(k=='csv'?csv():JSON.stringify({trades:T,S})).replace(/</g,'&lt;')}</textarea><button class=btn style="margin-top:8px" onclick="$('#tx').select();document.execCommand('copy')">COPY</button> <button class="btn s" onclick="md()">CLOSE</button>`)}
function im(k){md(`<h3>${k=='csv'?'IMPORT CSV':'RESTORE JSON'} — tempel data / pilih file</h3><input type=file onchange="const f=this.files[0],r=new FileReader();r.onload=()=>$('#tx').value=r.result;r.readAsText(f)"><textarea id=tx rows=12 style="margin-top:8px"></textarea><button class=btn style="margin-top:8px" onclick="doIm('${k}')">IMPORT</button> <button class="btn s" onclick="md()">CLOSE</button>`)}
async function doIm(k){try{const s=$('#tx').value;if(k=='json'){const d=JSON.parse(s);T=d.trades;if(d.S)S=d.S;await saveS()}else{const rows=parseCsv(s),h=rows[0];let n=Math.max(0,...T.map(t=>t.no));rows.slice(1).filter(r=>r.length>1).forEach(r=>{const t={img:[]};h.forEach((k,i)=>t[k]=['day','pair','session','model','tf'].includes(k)?(r[i]?r[i].split('|'):[]):r[i]);t.no=++n;T.push(t)})}await save();md();go()}catch(e){alert('Format tidak valid')}}
const md=h=>{$('#md').innerHTML=h?`<div class=modal><div>${h}</div></div>`:''};
function view(no){const t=T.find(x=>x.no==no);md(`<h3>TRADE #${String(no).padStart(3,'0')}</h3><div class=card>${[['DATE',t.date],['DAY',(t.day||[]).join(', ')],['PAIR',(t.pair||[]).join(', ')],['SESSION',(t.session||[]).join(', ')],['DIRECTION',t.dir],['MODEL',(t.model||[]).join(' • ')],['TIME FRAME',(t.tf||[]).join(' • ')],['RR',t.rr],['RISK',t.risk],['RESULT',t.result+' ('+fr(tr(t))+')'],['TIME ENTRY',t.time],['IDEAL R',t.ideal]].map(([k,v])=>`<div class=k style="margin-top:8px">${k}</div><div>${v||'-'}</div>`).join('')}<div class=k style="margin-top:8px">NOTE</div><div style="white-space:pre-wrap">${(t.note||'-').replace(/</g,'&lt;')}</div></div><div class=thumbs>${(t.img||[]).map(i=>`<img src="${i}">`).join('')}</div><div style="display:flex;gap:8px;margin-top:12px"><button class=btn onclick="edit(${no})">EDIT</button><button class="btn d" onclick="del(${no})">DELETE</button><button class="btn s" onclick="md()">CLOSE</button></div>`)}
async function del(no){if(confirm('Hapus trade?')){T=T.filter(t=>t.no!=no);await save();md();go()}}
const edit=no=>{D=JSON.parse(JSON.stringify(T.find(t=>t.no==no)));form()};
const add=()=>{D={no:0,date:new Date().toISOString().slice(0,10),day:[],pair:[],session:[],dir:'',model:[],tf:[],rr:S.rr,risk:S.risk,result:'',time:'',ideal:'',note:'',img:[]};form()};
function chips(k,o,multi=1){return`<div class=chips>${o.map(x=>`<span class="chip ${(multi?D[k].includes(x):D[k]==x)?'on':''}" onclick="tg('${k}','${x}',${multi})">${x}</span>`).join('')}</div>`}
function tg(k,x,m){if(m){const i=D[k].indexOf(x);i<0?D[k].push(x):D[k].splice(i,1)}else D[k]=D[k]==x?'':x;form()}
function form(){const nr=v=>v?(String(v).includes(':')?v:'1:'+v):'';const y=window.scrollY;

function imgs(fs){[...fs].forEach(f=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);D.img.push(c.toDataURL('image/jpeg',.75));form()};i.src=r.result};r.readAsDataURL(f)})}

 if(D.no)T=T.map(t=>t.no==D.no?D:t);else{D.no=Math.max(0,...T.map(t=>t.no))+1;T.push(D)}await save();md();go()}
